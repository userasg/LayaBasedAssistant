[project]
name = "laya-based-assistant"
version = "0.1.0"
description = "A local voice-and-text assistant: Laya (a fast System-1 decision model) routes and gates, a Deep Agent on Ollama works in a Docker sandbox, Whisper transcribes, and computer use drives your browser and Mac apps."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "deepagents[quickjs]>=0.7.14",
    "langchain>=1.2.0",
    "langchain-core>=1.2.4",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.0.5",
    "laya",
    "mlx-whisper>=0.4.3",
    "numpy",
    "ollama>=0.6.1",
    "pillow",
    "playwright>=1.63.0",
    "pyobjc-framework-vision>=12.2.2",
    "requests>=2.32.5",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.52.2",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
laya = { path = "../laya", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["slow: needs Ollama and/or Docker and takes a while"]
