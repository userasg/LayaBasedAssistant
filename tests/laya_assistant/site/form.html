<!doctype html><html><head><meta charset="utf-8"><title>Contact us</title></head><body>
<h1>Contact us</h1>
<form id="f" onsubmit="event.preventDefault(); document.getElementById('done').hidden = false; document.title='Message sent';">
<label>Your name <input name="name" required></label><br>
<label>Email <input name="email" type="email" required></label><br>
<label>Country <select name="country"><option>United Kingdom</option><option>United States</option><option>Germany</option></select></label><br>
<label>Message <textarea name="message"></textarea></label><br>
<label><input type="checkbox" name="terms"> I agree to the terms</label><br>
<button type="submit">Send message</button> <button type="button" onclick="location.href='index.html'">Cancel</button>
</form><p id="done" hidden>Thanks, your message was sent.</p></body></html>
